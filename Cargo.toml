[workspace]
members = ["crates/core", "crates/audio", "crates/stt", "crates/models", "crates/app"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
cpal = "0.16"
whisper-rs = "0.16"
ureq = "3"
sha2 = "0.11"
